<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>表现层配置工作台</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span>表现层配置</div>
    <div id="connectionBadge" class="badge">连接中…</div>
    <div id="statusLine" class="status"></div>
    <div class="toolbar-actions">
      <span id="dirtyBadge" class="dirty-badge hidden"></span>
      <button type="button" id="btnSaveAll" class="primary" title="Ctrl+S">保存全部</button>
      <button type="button" id="btnReload">重新加载</button>
      <button type="button" id="btnExportIndex">导出索引</button>
      <button type="button" id="btnReconnect" class="hidden">重连</button>
    </div>
  </header>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-search">
        <input type="text" id="navSearch" placeholder="搜索卡面 / 效果 / 特效…" />
      </div>
      <nav id="navTree" class="nav-tree"></nav>
    </aside>
    <main id="mainPane" class="main-pane"></main>
  </div>
  <div id="modalHost" class="modal-host hidden"></div>
  <div id="toastHost" class="toast-host"></div>
  <script src="/app.js"></script>
</body>
</html>
